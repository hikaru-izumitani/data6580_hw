name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run tests and generate coverage
        run: |
          # Do not pass --source=data5580_hw. That makes coverage.xml use
          # filename="app.py", which SonarCloud cannot map to data5580_hw/app.py.
          pytest --cov --cov-report=xml:coverage.xml --cov-config=.coveragerc --cov-branch
          python -m coverage report -m
          echo "===== coverage.xml paths (must start with data5580_hw/) ====="
          head -n 20 coverage.xml
          grep 'filename=' coverage.xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
